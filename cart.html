
<!doctype html>
<html lang="en">
  <head>
    <!-- Basic HTML settings -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Page title -->
    <title>Cart | Life Coach</title>

    <!-- Bootstrap CSS for responsive design and styling -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <!-- External CSS file -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>


    <!--------------------------- Navbar -------------------->


  <header>
    <nav class="navbar navbar-expand-lg bg-white;" style="min-height: 85px;">

        <div class="container">

            <!-- Logo -->
             <a class="navbar-logo ms-2 align-items-center" href="Home-1.html">

                <img  src="images/flower-logo-img.png" alt="flower logo" style="height: 4rem;">

            </a>

          <!-- Mobile Menu Button -->
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar">

                <span class="navbar-toggler-icon"></span>

            </button>
        
            <!-- Menu -->
            <div class="collapse navbar-collapse" id="mainNavbar">
            
              <!-- Nav Links -->
                <ul class="navbar-nav ms-auto align-items-lg-center">

                    <li class="nav-item">
                        <a class="nav-link px-3" href="About-2.html">About</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link px-3" href="Work_with_me.html">Work With Me</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link px-3" href="Books-4.html">Books</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link px-3" href="contact-5.html">Contact</a>
                    </li>
               <!-- Cart -->
                 <div class="header-cart">
                <button class="btn d-flex align-items-center ms-lg-3"
                   id="openCart">

                 <span class="fw-semibold price" id="headerTotal"> £0.00 </span>
                  <span class="ms-2 price fa-solid fa-bag-shopping" style="font-size: 20px;"></span>
                 <span
                      id="cartCount"
                                 class=" badge rounded-pill bg-success"> 0
                            </span>
                </button>
                </div>
        </div>
     </nav>
</header>

    <!-- ================= MAIN CART SECTION ================= -->
    <main class="container shop-page">
      <!-- Page Heading -->
      <h1>Cart</h1>

      <!-- Shopping Cart Products Table -->
      <div class="table-responsive cart-table-wrap">
        <table class="cart-table">
          <!-- Table Column Headings -->
          <thead>
            <tr>
              <th aria-label="Remove"></th>
              <th colspan="2">Product</th>
              <th>Price</th>
              <th>Quantity</th>
              <th>Subtotal</th>
            </tr>
          </thead>

          <!-- Cart products are dynamically displayed here using JavaScript -->
          <tbody id="cartPageItems"></tbody>
        </table>
      </div>

      <!-- ================= CART ACTIONS ================= -->
      <div class="cart-actions-row">
        <!-- Coupon Code Section -->
        <div class="coupon-area">
          <!-- Input field for entering coupon code -->
          <input id="cartCoupon" type="text" placeholder="Coupon code" />

          <!-- Button to apply discount coupon -->
          <button class="primary-button" id="applyCartCoupon" type="button">
            Apply coupon
          </button>

          <!-- Displays coupon success or error message -->
          <span id="cartCouponMessage" aria-live="polite"></span>
        </div>

        <!-- Button to update cart quantities and totals -->
        <button
          class="primary-button update-cart-button"
          id="updateCart"
          type="button"
        >
          Update cart
        </button>
      </div>

      <!-- ================= CART TOTALS SECTION ================= -->
      <section class="cart-totals">
        <h2>Cart totals</h2>

        <div class="totals-inner">
          <!-- Displays total price before discount -->
          <div class="total-line">
            <span>Subtotal</span>
            <strong id="cartPageSubtotal">£0.00</strong>
          </div>

          <!-- Displays final cart amount -->
          <div class="total-line">
            <span>Total</span>
            <strong id="cartPageTotal">£0.00</strong>
          </div>

          <!-- Redirects user to checkout page -->
          <a
            href="checkout.html"
            class="primary-button full-width checkout-link"
          >
            Proceed to checkout
          </a>
        </div>
      </section>
    </main>

    <!-- ================= CART SIDEBAR SECTION ================= -->

    <!-- Background overlay displayed when cart sidebar opens -->
    <div class="cart-overlay" id="cartOverlay"></div>

    <!-- Shopping Cart Sidebar -->
    <aside class="cart-sidebar" id="cartSidebar" aria-label="Shopping cart">
      <!-- Sidebar Header -->
      <div class="cart-header">
        <h2>Shopping Cart</h2>

        <!-- Button to close cart sidebar -->
        <button
          class="cart-close"
          id="closeCart"
          type="button"
          aria-label="Close cart"
        >
          &times;
        </button>
      </div>

      <!-- Sidebar Cart Products -->
      <div class="cart-body" id="cartItems">
        <!-- Default message when cart is empty -->
        <p class="empty-cart">No products in the cart.</p>
      </div>

      <!-- Sidebar Footer -->
      <div class="cart-footer">
        <!-- Displays sidebar cart subtotal -->
        <div class="subtotal-row">
          <strong>Subtotal:</strong>
          <strong id="cartSubtotal">£0.00</strong>
        </div>

        <!-- Redirects user to complete cart page -->
        <a href="cart.html" class="primary-button full-width"> View cart </a>

        <!-- Redirects user to checkout page -->
        <a href="checkout.html" class="primary-button full-width"> Checkout </a>
      </div>
    </aside>

    <!-- ================= JAVASCRIPT FILE ================= -->

    <!-- External JavaScript file handles cart functionality:
       1. Display cart products
       2. Remove products
       3. Update product quantities
       4. Apply coupon codes
       5. Calculate subtotal and total
       6. Open and close cart sidebar
  -->
    <script src="js/product.js"></script>
  </body>
</html>
